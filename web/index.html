<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" id="metaThemeColor" content="#0b0d10" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Herdrem" />
    <title>Herdrem</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' ws: wss: http: https:; frame-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <script src="/theme-boot.js"></script>
  </head>
  <body>
    <div id="app">
      <!-- Inline splash: visible before the JS bundle loads and Vue mounts.
           Vue replaces #app's innerHTML on mount, so this disappears automatically. -->
      <div id="boot-splash" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0a0e13;z-index:9999">
        <div style="display:flex;flex-direction:column;align-items:center;gap:24px">
          <img src="/brand-mark.png" alt="" width="64" height="58" aria-hidden="true" />
          <div style="width:48px;height:48px;border:3px solid #232c38;border-top-color:#60a5fa;border-radius:50%;animation:bp-spin 0.8s linear infinite"></div>
        </div>
      </div>
      <style>#boot-splash{opacity:1;transition:opacity 0.2s}@keyframes bp-spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
