name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check installer template sync
        run: ./deploy/check-sync.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI
        run: npm --prefix web ci && npm --prefix web run build

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Go tests
        run: go test ./...

      - name: Build linux binaries
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 \
              go build -trimpath -ldflags='-s -w' \
              -o "dist/herdrem-linux-$arch" ./cmd/herdrem
          done
          cp deploy/install.sh dist/install.sh
          (cd dist && sha256sum install.sh herdrem-linux-* > checksums.txt)
          ls -l dist

      # Only a pushed v* tag publishes. A manual run (workflow_dispatch) stops
      # after the build and tests above: its ref is a branch, which has no tag
      # for --verify-tag to find.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Re-running a tag (or retrying after an upload that stopped midway,
          # which leaves a draft) must not fail on `gh release create`: upload
          # into the existing release, replacing assets, and publish it.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag dist/*
          fi
