server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location ~* \.webmanifest$ {
        default_type application/manifest+json;
    }

    # Vue/PWA history fallback. Relay API and WebSocket traffic go directly
    # to the separately installed host relay, not through this container.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
